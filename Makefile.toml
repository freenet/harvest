[config]
default_to_workspace = false

[env]
CONTRACT_TARGET = "wasm32-unknown-unknown"
BUILD_PROFILE = "release"
WEB_CONTAINER_TOOL = "${HOME}/code/freenet/river/main/target/native/x86_64-unknown-linux-gnu/release/web-container-tool"
KEY_FILE = "${HOME}/.config/harvest/web-container-keys.toml"
# CONTRACT_ID will be set after first publish
# WEB_CONTAINER_TOOL and KEY_FILE will be configured for publishing

# --- Build tasks ---

# The contract and delegate WASMs are built by scripts/build-contract-wasm.sh
# and nowhere else. That script pins the flags that keep the build byte-
# reproducible, and CI's contract-drift guard runs the same script -- so the
# addresses CI reports are the addresses a publish deploys. A second `cargo
# build` for these crates here would quietly produce different bytes, which is
# to say a different contract, so the two build tasks that used to live here
# are gone rather than kept as convenience aliases.
#
# It also builds all four in ONE cargo invocation, which the old split into
# build-delegate + build-contracts did not: cargo unifies features across the
# packages named in a single invocation, so the split could resolve different
# features and produce different bytes.

[tasks.build-contract-wasm]
description = "Build the contract + delegate WASMs and print their BLAKE3 code hashes"
script = "./scripts/build-contract-wasm.sh"

[tasks.sync-wasm]
description = "Build the contract + delegate WASMs and copy them into the UI public dir"
script = "./scripts/build-contract-wasm.sh --sync"

[tasks.build-ui]
description = "Build the Dioxus UI"
dependencies = ["sync-wasm"]
script = '''
set -e
# WIPE THE OUTPUT DIRECTORY FIRST.
#
# dx writes CONTENT-HASHED asset filenames, so a rebuild lands BESIDE its
# predecessor instead of replacing it. Nothing prunes the old one and
# compress-webapp tars the whole directory, so without this the bundle is
# append-only across builds -- it grows a full UI wasm on every publish. The
# live container was measured carrying TEN copies, 37.7 MB uncompressed, where
# Delta and River carry one each (harvest#4).
#
# Safe to wipe: everything here is regenerated. dx re-copies ui/public/* (which
# is where sync-wasm stages contracts/), and the two fixed-name assets are
# re-copied below.
rm -rf target/dx/harvest-ui/${BUILD_PROFILE}/web/public
cd ui && dx build --${BUILD_PROFILE}
# dx doesn't copy CSS from assets/ to the build output root, so copy
# manually. Path is relative to `ui/` because we cd'd above and the
# script runs as one shell so the cwd persists.
cp assets/harvest.css ../target/dx/harvest-ui/${BUILD_PROFILE}/web/public/harvest.css
# The logo is referenced by harvest.css but dx does not copy it either, so the
# published app 404s on it. Same class of gap as the CSS.
cp assets/harvest-logo.svg ../target/dx/harvest-ui/${BUILD_PROFILE}/web/public/harvest-logo.svg
echo "CSS copied to build output"
'''

# --- Development tasks ---

[tasks.dev]
description = "Run UI in development mode with example data"
command = "dx"
args = ["serve", "--features", "example-data"]
cwd = "./ui"

[tasks.dev-no-sync]
description = "Run UI without Freenet connection"
command = "dx"
args = ["serve", "--features", "example-data,no-sync"]
cwd = "./ui"

[tasks.compress-webapp]
description = "Compress the UI into a tar.xz archive"
dependencies = ["build-ui"]
script = '''
mkdir -p target/webapp
cd target/dx/harvest-ui/${BUILD_PROFILE}/web/public && tar -cJf ../../../../../webapp/webapp.tar.xz *
cd - > /dev/null
echo "Compressed webapp to target/webapp/webapp.tar.xz"

# Gate the ARCHIVE, not the build directory, and do it here so a bad archive
# can never reach sign-webapp -- an archive that has been signed has already
# been given an identity, and refusing it afterwards is a worse place to find
# out.
#
# The clean above should make this unnecessary. That is exactly why it is here:
# a clean step can be skipped, reordered, or quietly broken by a later edit,
# whereas a gate that refuses the archive cannot be skipped silently. The clean
# is the fix; this is the thing that notices when the fix stops working.
./scripts/check-webapp-bundle.sh target/webapp/webapp.tar.xz \
  "target/dx/harvest-ui/${BUILD_PROFILE}/web/public"
'''

[tasks.sign-webapp]
description = "Sign the webapp archive with the web-container-tool"
dependencies = ["compress-webapp"]
script = '''
# Web-container versions must be STRICTLY increasing. The generic web-container
# contract rejects new_version <= current_version, so two archives signed at the
# same version reject each other in both directions and the site forks with no
# way back. This was minutes-since-epoch, which collides for any two publishes
# inside the same minute -- routine when a publish fails and is retried.
#
# Seconds cut the window 60x; the counter file closes it entirely on one machine
# by forcing the next version past the last one we actually published.
#
# The file is TRACKED, which is the only reason the same holds across machines:
# a publish from a fresh checkout starts from the committed value rather than
# from whatever its own clock says. That property is worth nothing unless the
# updated file is committed AFTER a publish, so this task says so out loud when
# it changes it. An uncommitted counter is a single-machine counter with a
# misleading name.
LAST_FILE=published-contract/last-version
VERSION=$(date +%s)
if [ -f "$LAST_FILE" ]; then
  LAST=$(cat "$LAST_FILE")
  # A corrupt or hand-edited counter must stop the publish, not silently fall
  # back to the clock: falling back is exactly how a version goes BACKWARDS,
  # and a rejected update is the one failure this whole mechanism exists to
  # prevent.
  case "$LAST" in
    ""|*[!0-9]*)
      echo "error: $LAST_FILE does not hold a plain number (got '$LAST')" >&2
      echo "       Fix it to the last published version before publishing." >&2
      exit 1 ;;
  esac
  if [ "$VERSION" -le "$LAST" ]; then
    VERSION=$((LAST + 1))
    echo "Clock version collided with last published ($LAST); using $VERSION"
  fi
fi
echo "$VERSION" > "$LAST_FILE"
echo "Signing with version: $VERSION"
echo "REMEMBER: commit $LAST_FILE once the publish succeeds, or the next"
echo "          publish from another checkout restarts the sequence."
${WEB_CONTAINER_TOOL} sign \
  --input target/webapp/webapp.tar.xz \
  --output target/webapp/webapp.metadata \
  --parameters published-contract/webapp.parameters \
  --version $VERSION \
  --key-file ${KEY_FILE}
'''

[tasks.publish-harvest]
description = "Publish the Harvest UI to the Freenet network"
dependencies = ["sign-webapp"]
script = '''
set -e
# `encodingProtocol=native` is REQUIRED and its absence does not look like a
# configuration error. Without it the node answers in a different encoding and
# fdev misparses the reply as `invalid value: integer 12, expected Ok or Err`,
# which reads like a version mismatch between client and node. It is not; a
# matching fdev fails identically. The UI sets the same parameter
# (`ui/src/gateway/connection.rs`).
: "${FREENET_NODE_URL:=ws://127.0.0.1:7509/v1/contract/command?encodingProtocol=native}"
export FREENET_NODE_URL
echo "Publishing to $FREENET_NODE_URL"

# The Bitcoin ADDRESSING constants are pinned at build time (the gateway CSP
# forbids asking a bridge at runtime -- harvest#29), so a contract rebuild
# re-keys them and this build goes quietly wrong. That happened: harvest#30,
# stale by five generations, and it did NOT fail silent. The superseded tip
# contract still exists and still holds its last state, so the published app
# showed a chain tip ~400 blocks old as though it were live, and every invoice
# named an address contract that was never published.
#
# So check before publishing, which is the moment the cost is incurred. This
# cannot live in CI -- there is no bridge there.
#
# Exit 2 means "could not check" (no bridge reachable) and is NOT treated as a
# pass, because recording "I could not look" as "it is fine" is the exact
# defect being guarded against. Override deliberately if you must.
set +e
./scripts/check-bitcoin-constants.sh
CHECK_RC=$?
set -e
if [ "$CHECK_RC" -eq 1 ]; then
  echo "" >&2
  echo "error: refusing to publish -- see the mismatch above." >&2
  exit 1
elif [ "$CHECK_RC" -eq 2 ]; then
  if [ "${HARVEST_SKIP_BRIDGE_CHECK:-}" = "1" ]; then
    echo "WARNING: publishing WITHOUT having checked the Bitcoin constants" >&2
    echo "         (HARVEST_SKIP_BRIDGE_CHECK=1). If they are stale, this build" >&2
    echo "         will show stale chain data as live. See harvest#30." >&2
  else
    echo "" >&2
    echo "error: could not verify the Bitcoin constants against a bridge, so" >&2
    echo "       refusing to publish. Start a bridge, set HARVEST_BRIDGE_URL," >&2
    echo "       or set HARVEST_SKIP_BRIDGE_CHECK=1 to publish unverified." >&2
    exit 1
  fi
elif [ "$CHECK_RC" -ne 0 ]; then
  # ANY other exit code means the check did not run to a verdict at all: not
  # executable (126), not found or bad interpreter (127), killed by a signal
  # (128+n). Without this branch those fall through to publish, which is the
  # precise failure the check exists to prevent -- "I could not look" recorded
  # as "it is fine" -- reintroduced one level up in the wrapper that calls it.
  #
  # Found in review. Trigger is mundane: a checkout that drops the executable
  # bit (core.fileMode=false) silently defeats the entire gate.
  echo "" >&2
  echo "error: scripts/check-bitcoin-constants.sh did not run to a verdict" >&2
  echo "       (exit $CHECK_RC). Refusing to publish rather than assuming the" >&2
  echo "       constants are fine. Check the script is present and executable." >&2
  exit 1
fi

# CORRECTION (2026-09-06). An earlier version of this comment asserted that
# "fdev EXITS 0 ON A FAILED PUBLISH". That is FALSE for fdev 0.3.295 and was my
# error, not fdev's: I read the exit status of a PIPELINE ending in `tail`,
# which is tail's status, and attributed it to fdev. Reproduced both ways
# against a dead port -- `fdev publish ...; echo $?` gives 1; the same command
# `| tail -1; echo $?` gives 0.
#
# What fdev actually does (src/main.rs:52-72, src/commands.rs:298-307): a
# ResponseTimeout exits 3, a conformance violation exits 4, and everything else
# -- including "Failed to receive response" -- is a plain Err and exits 1.
#
# The guard below stays, for a better reason than the false one. fdev has TWO
# success arms and several failure arms, so the exit code alone does not answer
# "did the contract actually land": exit 3 in particular means "submitted, may
# have succeeded". The output check is what distinguishes them, and it fails
# closed on wording it does not recognise. Keeping the exit code as well means
# a timeout can be reported honestly instead of as a flat failure.
if OUT=$(fdev publish \
  --code published-contract/web_container_contract.wasm \
  --parameters published-contract/webapp.parameters \
  contract \
  --webapp-archive target/webapp/webapp.tar.xz \
  --webapp-metadata target/webapp/webapp.metadata 2>&1); then
  FDEV_RC=0
else
  FDEV_RC=$?
fi
echo "$OUT"
# BOTH strings are successes and both must be accepted. fdev's `put()` has two
# success arms (fdev-0.3.295 src/commands.rs:287 and :295), each returning
# Ok(()):
#
#   PutResponse    -> "Contract published successfully"
#   UpdateResponse -> "Contract updated successfully"
#
# WHICH arm you get depends on the node MODE, not on whether the contract is
# already hosted -- an earlier version of this comment said "every publish after
# the first" and that is wrong. Corrected by the republish on 2026-09-06, which
# went to an already-hosted contract on the network-mode node and still logged
# "Contract published successfully".
#
#   `freenet network` -- the PUT operation replies PutResponse
#                        (operations/put/op_ctx_task.rs), so the Put wording,
#                        every time, hosted or not.
#   `freenet local`   -- a re-PUT into a contract the node already holds goes
#                        through the executor's merge path
#                        (contract/executor/runtime/contract_ops.rs, whose own
#                        comment names "client-initiated puts (e.g. fdev
#                        publish)"), which replies UpdateResponse.
#
# So the arm that would have been misreported is the ordinary `freenet local`
# dev workflow rather than this one. Both are successes, so both are accepted;
# the failure direction was always safe, only the message was wrong.
#
# Caught in review, and worth keeping the reason: the guard had been watched
# working exactly once, on a first publish taking the Put path, which is not
# evidence about any other path.
if ! echo "$OUT" | grep -qE "Contract (published|updated) successfully"; then
  echo "" >&2
  echo "error: publish did NOT succeed -- fdev reported neither" >&2
  echo "       \"Contract published successfully\" nor \"Contract updated" >&2
  echo "       successfully\"." >&2
  echo "       Do NOT commit published-contract/last-version." >&2
  if [ "$FDEV_RC" -eq 3 ]; then
    echo "" >&2
    echo "       NOTE: fdev exited 3, which is its dedicated code for a response" >&2
    echo "       TIMEOUT (main.rs:52, EXIT_RESPONSE_TIMEOUT) -- the request was" >&2
    echo "       submitted and MAY have succeeded. Do not assume it failed." >&2
    echo "       Settle it by comparing the served asset hash against the built" >&2
    echo "       one, as described below, rather than by re-publishing blind." >&2
  fi
  exit 1
fi
echo ""
echo "Published Harvest to Freenet"
echo "VERIFY IT: a 200 from the node proves nothing -- the node serves the"
echo "  PREVIOUS bundle until re-extraction. Compare the served asset hash"
echo "  against the built one:"
echo "    curl -s 'http://127.0.0.1:7509/v1/contract/web/<contract-id>/?__sandbox=1' \\"
echo "      | grep -oE 'harvest-ui-dxh[a-f0-9]+[.]js'"
echo "    ls target/dx/harvest-ui/release/web/public/assets/"
echo "  If they differ, the publish did not take effect."
echo ""
echo "REMEMBER: commit published-contract/last-version now that it succeeded."
'''

# --- Testing ---

[tasks.test]
description = "Run all tests"
command = "cargo"
args = ["test", "--workspace"]

[tasks.clippy]
description = "Run clippy on all targets"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

# --- Migration ---

[tasks.code-hashes]
description = "Print the current ADDRESSES (code hash + parameters) and refuse if a code hash is already recorded as superseded"
dependencies = ["build-contract-wasm"]
# The logic lives in a script rather than inline here so CI can run the SAME
# check without needing cargo-make on the runner. Two copies of a guard drift,
# and the copy that drifts is the one nobody is watching.
script = "./scripts/check-code-hashes.sh"
