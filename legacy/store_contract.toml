[[entry]]
version = "V11"
description = "Superseded by moving `freenet-bitcoin-common` 0e5b9d9 -> a037181, done so the UI can take `freenet-bitcoin-inbox` and `freenet-bitcoin-generation` for registering an order's payment address with the bridge (#59); all three must resolve from one commit or their `BridgeId` stops being one type. NO SOURCE this contract compiles in changed: `common/` is byte-identical between the two commits (an empty `git diff 0e5b9d9 a037181 -- common/`, checked rather than assumed), and nothing in Harvest's own contract source changed either. What moved is a panic-location string. Cargo checks a git dependency out under a path naming its commit, and `scripts/build-contract-wasm.sh` remaps the Cargo home but not that commit segment, so the store WASM carried `/cargo/git/checkouts/freenet-bitcoin-ca471e53e3ade0e6/0e5b9d9/common/src/spv.rs` and now carries `.../a037181/...` (found with `strings` on the built WASM: the old commit appears zero times and the new one once). That is also why ONLY this artifact moved: it is the one that verifies SPV payment proofs and so reaches that file, while `reputation_contract`, `mailbox_contract` and `harvest_delegate` kept their hashes. Consequence worth knowing: until the build remaps that segment too, every bump of the freenet-bitcoin git dependency re-keys the store even when no source changes. The parameter structs are UNCHANGED (`cbor(StoreParameters)` is still 56 bytes), so no derivation split is needed, and no record's identity or signature preimage changed, so every earlier generation's records still verify against this one."
date = "2026-09-16"
code_hash = "97db0a2e4b10de814b760459b2db611285a5b26f49e3db02282b3a8565751392"

[[entry]]
version = "V12"
description = "Superseded by replacing `listing_id` on `Order` with `listing_tag`, a digest keyed by the buyer-seller conversation (harvest#57), so a published order no longer reveals which listing it bought to anyone but its two parties. Unlike V11 this is a real record change: the order's CBOR, and so both its id (`OrderId::from_terms`) and the preimage its seller signature covers, change. An order written by this generation or any earlier one still DECODES (serde ignores the removed field) but no longer VERIFIES. Expiry does not remove an order from state (`OrdersV1` prunes only by count), so the migration fold refuses, permanently, any predecessor generation that ever held an order, dropping its listings and info with it, as `docs/design/migratability.md` describes for record changes. Acceptable only because no store has ever been created. Listings, store info and the parameter structs are unchanged (`cbor(StoreParameters)` still 56 bytes), so no derivation split is needed."
date = "2026-09-17"
code_hash = "52107dcfcc21b96990b8403a37408258f8349335bab42dea9d630672156d4f40"

[[entry]]
version = "V13"
description = "Superseded by removing `payment_instructions` from `StoreInfoV1`. The field was freeform text the UI only ever displayed, labelled \"Payment Instructions\" with a placeholder inviting `BTC: bc1q...` -- which is wrong twice over now that an invoice names a fresh address derived from the seller's account key, and which invited payments to an address no order covers, so no bridge watches it and nothing can ever be shown as Paid. Ian caught it from a screenshot of the store form. The store's description takes over, and the UI now renders it as markdown (a subset parsed to elements, never to an HTML string -- see `ui/src/markdown.rs` for why, and note that is UI-only and not a contract change). IMPORTANT for anyone migrating from this generation or earlier: `AuthorizedStoreInfoV1::verify` re-serializes `self.info` and compares it against the payload inside the signed `ScopedPayload`, so a store published before this generation still DECODES (serde ignores the removed key, pinned by `store_info_from_before_the_notes_field_was_removed_still_decodes`) but no longer VERIFIES -- the contract reports \"store info signature invalid\" and refuses the state, taking its listings and orders with it. `a_store_info_re_encodes_to_its_signed_bytes_but_for_the_removed_field` pins that the difference is exactly the removed key and nothing else. A seller whose store predates this must publish their details again, which re-signs them in the new shape. Acceptable only because no store but a test one has ever been created; the same trade V12 made. Listings and the parameter structs are unchanged (`cbor(StoreParameters)` still 56 bytes per `cargo make code-hashes`), so no derivation split is needed, and the delegate did not move (`08eac64a...` before and after), because nothing reachable from it touched the field."
date = "2026-09-17"
code_hash = "ddac8dd508819052c3771d23aaff9078e52c84ca17e62ae7e68ce356770b3a67"

[[entry]]
version = "V14"
description = "Superseded by settling an order only with a payment inside its window (harvest#77, and the PR #83 review). `verify_on_chain_proof`, which `AuthorizedOrder::verify` calls and so the contract enforces, counts an outpoint only if the fold's winning confirmation is strictly after the order's `anchor` block and at most `PAYMENT_WINDOW_BLOCKS` (48 + 2016) after it, and refuses an on-chain proof for an order with no anchor (`ProofError::NoAnchor`). The lower edge stops a reissued address's old payment settling a new invoice, which a fresh install had done with nobody paying; the upper edge stops a new invoice's payment also settling an older unpaid invoice on the same address. No record's identity or signature preimage changed, and the parameter structs are unchanged (`cbor(StoreParameters)` still 56 bytes), so no derivation split is needed. Intermediate builds of this change (`903a3529...`, lower edge only, and `eb18a826...`, which differs from the final build only through a doc-comment edit in `common/src/payment.rs` and delegate wire types in `common/src/bitcoin_delegate.rs`, no verification change) were committed on the PR branch and never published or merged, so they are not recorded as generations. IMPORTANT for anyone migrating from this generation or earlier: verification got STRICTER, so a predecessor whose state holds a `Paid` or `PaymentReversed` order settled by a payment outside its window, or an anchorless order in either status, no longer verifies against this one, and the fold discards that generation in full, as `docs/design/migratability.md` describes. The one store known to exist is a test store, and it holds exactly such orders: the two invoices that settled themselves during the screenshot run that found the bug. Acceptable for the same reason V12 and V13 were."
date = "2026-09-18"
code_hash = "3f47ab79e985659f7c03728d907f05e9321037aa23c1ff7c7e569512a445489a"

[[entry]]
version = "V15"
description = "Superseded by harvest#26, #55 and #85, all this contract's own changes. (1) harvest#26: `ListingsV1::verify` now requires the listings strictly ascending by id, so it refuses an unsorted list and a listing held twice; both used to verify, and a peer that took such a state whole held different bytes from one that reached the same set through deltas, forever. `ListingsV1::normalize` (sort, then drop a repeated id) runs in `apply_delta`, in `update_state` before the result is encoded, and in the migration fold, because the scaffold skips a child's `apply_delta` when a merge brings it nothing. (2) harvest#85: `enforce_order_cap` ranked terminal orders for dropping first, and terminal-ness is not monotone in the status rank `merge_order` maximises, so the cap was not associative (P = {x Awaiting, newest}, Q = {x Cancelled}, R = a full cap of older orders: `(P+Q)+R` dropped x, `P+(Q+R)` kept it). It now keeps the newest `MAX_ORDERS` by signed `created_at`, then id, which no merge can change; an old Paid order can now be dropped before a newer Cancelled one. (3) harvest#55: `get_state_delta` answers a zero-byte state with an empty delta and treats a zero-byte summary as the summary of the empty state, where both used to be decode errors that failed a new subscriber's first exchange. No record's identity or signature preimage changed, so every V14 record still verifies here; a predecessor state that was unsorted or held a listing twice is normalised by the fold rather than refused. `harvest-common` is compiled into every artifact here, and its reputation changes (#22) move these bytes too. The parameter structs are unchanged (`cbor(StoreParameters)` still 56 bytes), so no derivation split is needed. Also for harvest#55, found by `fdev verify-merge` on empty corpora: `update_state` answers zero bytes merged with nothing but zero bytes with zero bytes rather than the encoded default, so the empty state is idempotent under merge. In this contract and the `update_state` `State` arm treats a zero-byte state as no state instead of failing to decode it. Also from the PR #82 review: the order summary names each order by the full 32-byte BLAKE3 of its record, not an 8-byte truncation, so two same-rank variants cannot collide into looking identical; and `validate_state` refuses a state that does not re-encode to its own bytes. KNOWN LIMIT of the order cap, recorded in docs/untested-invariants.md: `created_at` is seller-chosen and unbounded, so the seller can evict old orders, Paid ones included, by creating `MAX_ORDERS` newer ones, or pin slots with far-future dates. From the PR #82 re-review: `AuthorizedStoreInfoV1::verify` requires version-0 info to be exactly the default, where it used to skip version 0 and so accepted ANY unsigned name, certificate or encryption key in a store whose seller had not published details; a predecessor holding such content is carried forward by the fold with its version-0 info reset to the default (`merge_store_reporting_discard`), so its listings and orders still move. The order summary encodes its id and digest as CBOR byte strings (`Bytes32`), a summary wire change; `OrderId` and every order record are unchanged."
date = "2026-09-18"
code_hash = "c4e212924bc4547525a63c3ab13f6170b552224b32e9ae990b4a438abe890a98"

[[entry]]
version = "V16"
description = "Superseded by harvest#52, the store code, which changes this contract's PARAMETERS and its STATE. (1) Parameters: `StoreParameters` held the seller's whole Ed25519 verifying key (56 B of CBOR); it now holds `store_code`, the first 16 base58 characters of that key (29 B), so a shared link carries 16 characters instead of a 44-character contract id (16 rather than 12 after the PR #91 review: about 2^94 to take one chosen seller's code, and about 2^80 to hit any one of 10,000 stores at once, where 12 characters gave about 2^57) and any client re-derives the address from the code and the bundled WASM. EVERY generation up to and including this one was published under a whole-key encoding (V1 and V6..=V16 the 56 B one, V2..=V5 the 109 B one), so `ui/src/migrate.rs` derives them under a frozen copy of it, split at `LAST_WHOLE_KEY_STORE_PARAM_GENERATION = 16`; a row added after this one falls on the code side by itself. (2) State: a code names many keys, so the owner moved into the state. `StoreStateV1` gained `owner: Option<VerifyingKey>` (`#[serde(default)]`), every record is verified against it, the owner must begin with the code, and a state naming an owner must hold something that owner signed. Two owners of one code resolve to the smaller key by bytes, deterministically and convergently (the lexicographic product of a chain of owners with each owner's own merge); Delta's first-writer-wins refusal is not convergent and was not copied. `StoreStateV1Summary` and `StoreStateV1Delta` gained `owner` too, and the top-level `ComposableState` is now hand-written rather than `#[composable]`, because a change of owner has to drop the other key's records and the macro cannot express that. IMPORTANT for anyone migrating from this generation or earlier: a whole-key generation's state has no owner, and the new contract refuses records with none, so the fold names the seller's key as the owner of any such state that holds records (`migrate::name_whole_key_owner`). That is exact rather than assumed: these states were probed at addresses derived from that key, and their contract verified every record against it. No record's identity or signature preimage changed, so with the owner named every V16 record verifies against V17. Built at `5110283` (PR #82), and the committed artifact on `main` through `66be3a4`."
date = "2026-09-18"
code_hash = "95f464c47796ec638185bb023a37e60dff3a63ecbe115824a3be1bb28c82067d"
