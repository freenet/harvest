[[entry]]
version = "V8"
description = "Superseded by the buyer-to-seller messaging work. This contract's own change is one field: `StoreInfoV1` gained `encryption_public_key: Option<[u8; 32]>`, the X25519 public half a buyer needs in order to open a conversation with the seller, published in the store's signed details. It carries `#[serde(default, skip_serializing_if = \"Option::is_none\")]` and BOTH halves are load-bearing -- `default` so a V1..V7 state still decodes, and `skip_serializing_if` so a store that predates the field re-encodes to the identical bytes and every ghostkey signature already made over it still verifies. `#[serde(default)]` alone would have re-encoded an explicit null and invalidated them all; that is pinned by `a_store_info_that_predates_the_encryption_key_re_encodes_unchanged`, observed red against the naive form. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the buyer-to-seller messaging work: a buyer's ephemeral X25519 conversation key and the one-sided exchange it rides on, the `EncryptedMessage` envelope with `message_aad` binding every field the ciphertext does not cover, bucket padding, and the `MAX_MESSAGES` / `MAX_MAILBOX_BYTES` / `MAX_MESSAGE_BYTES` bounds. `common/src/delegate.rs` also gained the whole buyer-conversation request and response family (store, recall, forget, export, import, mark-backed-up, plus `ConversationSecret` and `RecalledConversation`), which is a wire surface between the UI and the delegate. The parameter structs are UNCHANGED this generation -- field-for-field identical to V7's, verified rather than assumed -- so `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band in `store_contract.toml` is unaffected. No new derivation split is needed"
date = "2026-09-05"
code_hash = "c51cbcf2730b8d8511d48768c435462fa1ae37f0a4b513a96cf1d23d73f78370"

[[entry]]
version = "V9"
description = "Superseded by the buy flow. This contract's own behaviour changed in two ways beyond the shared `harvest-common` movement. `OrdersV1::verify` and `ListingsV1`'s verification now reject any record whose id is not the one its terms give, which is what makes the derivation change binding on the network rather than merely on the issuer. And `bitcoin_address_instance_id` here is now a thin wrapper over the shared derivation rather than a second copy of it -- the duplicated-contract-address shape that `docs/untested-invariants.md` ranks first, where the copies drifted and every derived id named a contract that had never been published. IMPORTANT for anyone migrating from this generation or earlier: because the id derivation changed, every record V1..V9 published fails verification against V10, so the fold discards those generations in full. That is a decided consequence rather than a defect -- see `docs/design/migratability.md`, and note the requirement it records for the next time. Four substantive causes, and a reader deserves all of them. (1) `OrderId` and `ListingId` are now derived from the record's own TERMS -- the whole encoded struct with the id blanked -- and are 32 bytes rather than 16. The derivation change closes a swap attack: `OrderId` hashed only (seller, listing, created_at_ms, buyer), so a seller could sign two differently-termed valid orders sharing one id and, since `merge_order`'s equal-rank tie-break keeps the smaller CBOR, publish the larger, let a buyer pay it, then publish the smaller and have the network converge on a record whose destination never received anything. `ListingId` had the same shape with a different symptom: it omitted `price`, and `ListingsV1::apply_delta` is first-writer-wins, so two listings under one id diverge permanently between peers. The widening to 32 bytes takes a chosen-pair collision from ~2^64 to 2^128 and was done here because the re-key makes it free exactly once. `verify_terms` and `AuthorizedListing::verify` now ENFORCE the derivation, so the contract refuses a record filed under any other id. (2) `Order` gained `anchor: Option<BlockAnchor>` and `order_binding: Option<[u8; 32]>`, both with `#[serde(default, skip_serializing_if)]` -- both halves load-bearing, since `verify_terms` re-serializes the order and compares against the signed payload, so a field that encoded when absent would invalidate every earlier signature. The anchor is what lets a buyer judge how recently a commitment was made without trusting a seller-chosen timestamp; the binding is `H(n)` from the incentive design, which is what stops one published commitment being payable by every buyer who was shown it. (3) Payment-proof assembly: `harvest_common::payment::assemble_on_chain_proof` builds the `OnChainPaymentProof` the verifier already accepted but which nothing constructed, so an order can now actually reach `Paid`. (4) `Order::bitcoin_address_instance_id` moved the `BLAKE3(code_hash || cbor(parameters))` address derivation into `harvest-common`, and the store contract now calls it instead of holding a second hand-written copy. This generation carries the buy flow: the buyer's request, the seller's commitment, and everything the buyer checks before paying. Several of its changes are in `harvest-common`, which is compiled into every artifact here, so these bytes move whether or not this artifact's own behaviour changed. The parameter structs are UNCHANGED this generation -- `StoreParameters`, `MailboxParameters` and `ReputationParameters` were diffed field-for-field against V8 rather than assumed -- so no new derivation split is needed and the existing legacy parameter bands are unaffected."
date = "2026-09-06"
code_hash = "8884c7258f9547743367a1b440f3803b216c09903148407c7f6f5a2af84ae785"

