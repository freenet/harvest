[[entry]]
version = "V7"
description = "Superseded by the 2026-09-05 correctness review. Its own change is that `apply_delta` is now all-or-nothing: it used to commit a verified entry AND ITS NONCE before rejecting a later invalid one in the same delta, and a burnt nonce makes genuine feedback permanently undeliverable, because `used_nonces` is what suppresses a replay. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the 2026-09-05 correctness review: `StoreStateV1::orders` gained `#[serde(default)]`, without which no V1 state decoded at all; `apply_delta` became all-or-nothing in orders, listings and feedback; the equal-rank order tie-break now keeps the SMALLER encoding and `AuthorizedOrder::verify` refuses any field the status does not consult, which together close a permanent third-party displacement of a paid order; a reversal now requires evidence the order was once covered; and confirmation depth is capped at what the bridge attested. The parameter structs also became `pub(crate)` with constructors so a second derivation no longer compiles -- a visibility change ONLY, not a field change: `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band is unaffected. `freenet-bitcoin-common` moved bbeed1e -> 0e5b9d9 for the attested-depth cap, and it links into all four artifacts as well. `scripts/build-contract-wasm.sh` is NOT among the causes: its reproducible-build fix landed in 47b67aa and was already in effect for the generation this supersedes"
date = "2026-09-05"
code_hash = "7163be62207ae9f77ee2ccb8e0249fe2d824cb52788732eb6fe60cca52b0f801"

[[entry]]
version = "V8"
description = "Superseded by the buyer-to-seller messaging work, in which this contract took NO behavioural change of its own. Its only source edit this generation is a comment: a `nonce-identity-waiver:` marker on the `used_nonces` filter in `update_state`, recording that this contract still keys identity on `token.nonce` and therefore still has the defect the mailbox contract's re-key just fixed -- two entries can share a published token because the RSA signature covers `entry.token` alone, so a neutered variant can permanently exclude a genuine one, and a migration fold can carry the wrong one forward. That is deliberately NOT fixed here: it is issue #22, it needs this contract's own re-key, and the better repair is to sign the whole entry so the variant cannot be constructed at all. Demonstrated by execution in `known_gap_two_feedback_variants_sharing_a_token_do_not_converge`, and the migration fold now REPORTS an exclusion rather than dropping it silently. So these bytes move for one reason only: `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the buyer-to-seller messaging work: a buyer's ephemeral X25519 conversation key and the one-sided exchange it rides on, the `EncryptedMessage` envelope with `message_aad` binding every field the ciphertext does not cover, bucket padding, and the `MAX_MESSAGES` / `MAX_MAILBOX_BYTES` / `MAX_MESSAGE_BYTES` bounds. `common/src/delegate.rs` also gained the whole buyer-conversation request and response family (store, recall, forget, export, import, mark-backed-up, plus `ConversationSecret` and `RecalledConversation`), which is a wire surface between the UI and the delegate. The parameter structs are UNCHANGED this generation -- field-for-field identical to V7's, verified rather than assumed -- so `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band in `store_contract.toml` is unaffected. No new derivation split is needed"
date = "2026-09-05"
code_hash = "c47e6fc580e2ecdbc4f4e4330c926c1e2d3092070519f074366bf09964d0e826"

[[entry]]
version = "V9"
description = "Superseded by the buy flow. Nothing this contract itself does changed; it moves with `harvest-common`, which is compiled into it. Four substantive causes, and a reader deserves all of them. (1) `OrderId` and `ListingId` are now derived from the record's own TERMS -- the whole encoded struct with the id blanked -- and are 32 bytes rather than 16. The derivation change closes a swap attack: `OrderId` hashed only (seller, listing, created_at_ms, buyer), so a seller could sign two differently-termed valid orders sharing one id and, since `merge_order`'s equal-rank tie-break keeps the smaller CBOR, publish the larger, let a buyer pay it, then publish the smaller and have the network converge on a record whose destination never received anything. `ListingId` had the same shape with a different symptom: it omitted `price`, and `ListingsV1::apply_delta` is first-writer-wins, so two listings under one id diverge permanently between peers. The widening to 32 bytes takes a chosen-pair collision from ~2^64 to 2^128 and was done here because the re-key makes it free exactly once. `verify_terms` and `AuthorizedListing::verify` now ENFORCE the derivation, so the contract refuses a record filed under any other id. (2) `Order` gained `anchor: Option<BlockAnchor>` and `order_binding: Option<[u8; 32]>`, both with `#[serde(default, skip_serializing_if)]` -- both halves load-bearing, since `verify_terms` re-serializes the order and compares against the signed payload, so a field that encoded when absent would invalidate every earlier signature. The anchor is what lets a buyer judge how recently a commitment was made without trusting a seller-chosen timestamp; the binding is `H(n)` from the incentive design, which is what stops one published commitment being payable by every buyer who was shown it. (3) Payment-proof assembly: `harvest_common::payment::assemble_on_chain_proof` builds the `OnChainPaymentProof` the verifier already accepted but which nothing constructed, so an order can now actually reach `Paid`. (4) `Order::bitcoin_address_instance_id` moved the `BLAKE3(code_hash || cbor(parameters))` address derivation into `harvest-common`, and the store contract now calls it instead of holding a second hand-written copy. This generation carries the buy flow: the buyer's request, the seller's commitment, and everything the buyer checks before paying. Several of its changes are in `harvest-common`, which is compiled into every artifact here, so these bytes move whether or not this artifact's own behaviour changed. The parameter structs are UNCHANGED this generation -- `StoreParameters`, `MailboxParameters` and `ReputationParameters` were diffed field-for-field against V8 rather than assumed -- so no new derivation split is needed and the existing legacy parameter bands are unaffected."
date = "2026-09-06"
code_hash = "152a12dcf119e72d9b4a909033dcc367b0c9e57a1395c7fa02f5463131499dae"

