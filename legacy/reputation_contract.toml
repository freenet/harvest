# Superseded generations of the Harvest reputation contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# Instance ids are derived per store: `BLAKE3(code_hash || cbor(
# ReputationParameters))`. Since harvest#53 Phase C the parameters are the
# store key alone (`ReputationParameters { store_key }`), so the current
# record needs no delegate secret to address, and a buyer can reach it from
# the store they are looking at.
#
# Generations up to `LAST_RSA_REPUTATION_PARAM_GENERATION` (V15) were
# addressed by `{rsa_public_key_der, owner_verifying_key}`: an RSA public key
# (the store's record key since harvest#93 phase 1b, the Ghost Key's
# per-device `harvest:rsa_pk:{fingerprint}` before it) and the Ghost Key.
# `ui/src/migrate.rs::reputation_candidate_ids` derives those under their own
# encoding (pinned as hex in `ui/src/migrate/tests.rs`), plus the seller's
# registered id, which is what reliably finds an old record.
#
# The state is grow-only: complaints keyed by order id, one per order, and a
# certificate back-filled when empty. The RSA generations held feedback
# entries (none was ever written outside tests) and a certificate; they
# decode into the current state with their certificate kept, so folding a
# generation is idempotent and carries the certificate forward.

