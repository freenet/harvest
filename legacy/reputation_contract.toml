[[entry]]
version = "V15"
description = "Superseded by harvest#53 Phase C (the receipted complaint), which changed `harvest-common`: `reputation.rs` replaced `FeedbackEntry` with `Complaint` (a buyer-signed complaint about one PAID order of the store) and `ReputationParameters` lost its RSA key, `FeedbackCategory` lost `Other`, and `delegate.rs` lost the blind-signature and transaction requests (`InitReputationKeys`, `BlindSignFeedbackToken`, `BeginTransaction`, `RecordBlindSignature`, `ListTransactions`, `TransactionRecord`). `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's changed completely: it now holds `Complaint`s keyed by order id, each verified against the store key (the order's terms), the order's payment evidence and the order's `buyer_receipt_key`. V15 is the LAST generation addressed by `{rsa_public_key_der, owner_verifying_key}` (the RSA key and the Ghost Key); from V16 the record is addressed by the store key alone, so `ui/src/migrate.rs` derives V1..=V15 under the RSA encoding (`LAST_RSA_REPUTATION_PARAM_GENERATION`). Their state decodes into the new type with its certificate and no complaints: no feedback entry was ever written outside tests."
date = "2026-09-23"
