# Superseded generations of the Harvest Ghost Key index contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# The index is new in harvest#93 phase 1c. Its first row is harvest#53
# Phase B's; `ui/build.rs` no longer lists this file in `MAY_BE_EMPTY`.
#
# Instance ids are derived per Ghost Key: `BLAKE3(code_hash || cbor(
# IndexParameters))`, whose single field is the Ghost Key's verifying key, so
# every generation is derivable from the Ghost Key alone.
#
# The state is a map from store key to the Ghost Key's signed backing
# statement for that store, grow-only, the smaller encoding on a clash,
# bounded to the smallest `MAX_INDEX_ENTRIES` store keys. Any valid state of
# one generation is a valid state of the next while `IndexEntry` and
# `BackingStatement` keep their shapes, so a fold is plain data transfer.

[[entry]]
version = "V1"
description = "Superseded by harvest#53 Phase B (the buyer's receipt key, the buyer's cancel and the seller's despatch), which changed `harvest-common`: `Order` gained `buyer_receipt_key`, `AuthorizedOrder::verify` accepts a `Cancelled` signed by it, `StoreStateV1` gained `fulfilment`, `classify_store_key_message` gained `Despatch`, and `RecalledConversation` gained `buyer_receipt_seed`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's did not: `IndexEntry`, `BackingStatement` and `IndexParameters` keep their shapes, so every V1 state verifies against V2 unchanged. The first generation of the index (harvest#93 phase 1c), the committed artifact on `main` from harvest#101 until this PR merged (unchanged by the intervening #120, #128 and #135)."
date = "2026-09-22"
code_hash = "0df754b5c0066bf4ed02b800a293b8eb219ff3c4178af1a0239a8cf7eec7faec"

[[entry]]
version = "V2"
description = "Superseded by harvest#53 Phase C (the receipted complaint), which changed `harvest-common`: `reputation.rs` replaced `FeedbackEntry` with `Complaint` (a buyer-signed complaint about one PAID order of the store) and `ReputationParameters` lost its RSA key, `FeedbackCategory` lost `Other`, and `delegate.rs` lost the blind-signature and transaction requests (`InitReputationKeys`, `BlindSignFeedbackToken`, `BeginTransaction`, `RecordBlindSignature`, `ListTransactions`, `TransactionRecord`). `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's did not, and `IndexParameters` is unchanged."
date = "2026-09-23"
code_hash = "88fe938bc67b794a497a1e9c657d527c9d857cc394259c02bb7e594000729a29"

[[entry]]
version = "V3"
description = "Superseded by harvest#70 (listing availability): `StoreStateV1` gained `listing_statuses`, one store-key-signed `ListingStatus` per listing id (`{listing, revision, availability: Available { quantity } | SoldOut | Withdrawn}`), merged per listing by the HIGHEST revision and then the smaller encoding (`SignedRecord::rank`, which every other signed record leaves at zero, so their merge is unchanged), and `classify_store_key_message` gained `ListingStatus`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's did not, and `IndexParameters` is unchanged. The generation harvest#53 Phase C shipped (`52afb47`, #143)."
date = "2026-09-23"
code_hash = "0a21fecfdd702dea40d5ccd51d6b7ecc095e101d1c8a8801a5594c4368d60361"

[[entry]]
version = "V4"
description = "Superseded by instant checkout, which changed `harvest-common`: `Listing` gained `checkout` (fixed sats price and delivery) and `choices`, both `#[serde(default, skip_serializing_if)]` so every earlier listing encodes, and so is identified and signed, exactly as before; `Order` gained `request_id` (skipped when absent), and an order carrying one takes its id from the request alone (`OrderId::for_request`); `merge_order` breaks an equal-status tie by the larger amount before the encoding (a change only for two orders under one id, which only a shared `request_id` produces); and `delegate.rs` / `bitcoin_delegate.rs` gained the auto-invoice arm and `PeekOrderAddresses`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's did not; its parameters are unchanged. The generation harvest#125 shipped (`f9558cd`)."
date = "2026-09-23"
code_hash = "e23c43c86fa12acfbed7778b8c15b22d4af87c8c0d6c673f47a5d606d9cca9e5"
