# Superseded generations of the Harvest Ghost Key index contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# The index is new in harvest#93 phase 1c. Its first row is harvest#53
# Phase B's; `ui/build.rs` no longer lists this file in `MAY_BE_EMPTY`.
#
# Instance ids are derived per Ghost Key: `BLAKE3(code_hash || cbor(
# IndexParameters))`, whose single field is the Ghost Key's verifying key, so
# every generation is derivable from the Ghost Key alone.
#
# The state is a map from store key to the Ghost Key's signed backing
# statement for that store, grow-only, the smaller encoding on a clash,
# bounded to the smallest `MAX_INDEX_ENTRIES` store keys. Any valid state of
# one generation is a valid state of the next while `IndexEntry` and
# `BackingStatement` keep their shapes, so a fold is plain data transfer.

[[entry]]
version = "V1"
description = "Superseded by harvest#53 Phase B (the buyer's receipt key, the buyer's cancel and the seller's despatch), which changed `harvest-common`: `Order` gained `buyer_receipt_key`, `AuthorizedOrder::verify` accepts a `Cancelled` signed by it, `StoreStateV1` gained `fulfilment`, `classify_store_key_message` gained `Despatch`, and `RecalledConversation` gained `buyer_receipt_seed`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This contract's did not: `IndexEntry`, `BackingStatement` and `IndexParameters` keep their shapes, so every V1 state verifies against V2 unchanged. The first generation of the index (harvest#93 phase 1c), the committed artifact on `main` from harvest#101 until this PR merged (unchanged by the intervening #120, #128 and #135)."
date = "2026-09-22"
code_hash = "0df754b5c0066bf4ed02b800a293b8eb219ff3c4178af1a0239a8cf7eec7faec"
