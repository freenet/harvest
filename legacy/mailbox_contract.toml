# Superseded generations of the Harvest mailbox contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# Instance ids are derived per owner: `BLAKE3(code_hash || cbor(
# MailboxParameters))`, whose single field is the owner's ghostkey verifying
# key. Like the store contract and unlike the reputation contract, that makes
# every generation derivable from the ghostkey alone, with no dependency on
# the delegate's secrets.
#
# The state is a set of encrypted messages deduplicated by
# `harvest_common::mailbox::entry_digest` -- a BLAKE3 over the WHOLE entry --
# and capacity-pruned by `enforce_message_cap` against both a count cap and a
# byte budget. Folding an old generation forward can re-admit a message the
# successor had already pruned; that is self-correcting, because `apply_delta`
# re-runs the same deterministic prune on the folded result.
#
# THIS HEADER WAS WRONG UNTIL 2026-09-05 AND IT IS READ BEFORE A MIGRATION IS
# RUN, so the corrections are recorded rather than quietly applied:
#
#   * "deduplicated by nonce" -- true for V1..V7, false from V8. Identity is
#     the entry digest. The nonce is a field the WRITER fills in, so while it
#     was the identity anyone holding the conversation key could displace a
#     message by submitting a different one under its nonce.
#   * "pruning by a TTL measured against the newest message" -- deleted in
#     `ecbec18`, well before this header stopped mentioning it. Retention keyed
#     on an unauthenticated timestamp let one message dated far in the future
#     evict every legitimate one.
#   * "harmless" -- the word is dropped. The prune is deterministic and
#     self-correcting, but a fold is not lossless: an oversized message is
#     refused outright (and now REPORTED rather than dropped in silence), and
#     at the cap the older generation is the side that loses, by construction,
#     because it ranks lower on timestamp. `ui/src/migrate.rs::merge_mailbox`
#     says what each of those does.

