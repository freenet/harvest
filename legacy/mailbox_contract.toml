[[entry]]
version = "V7"
description = "Superseded by the 2026-09-05 correctness review, and for this contract the substantive change is its own: retention stopped being governed by unauthenticated content. A 30-day TTL measured against the newest message present let one message dated far in the future evict every legitimate one, and made a mailbox permanently invalid the moment any message aged out; a `MAX_MESSAGES` count cap with a total, content-derived ranking replaces it. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the 2026-09-05 correctness review: `StoreStateV1::orders` gained `#[serde(default)]`, without which no V1 state decoded at all; `apply_delta` became all-or-nothing in orders, listings and feedback; the equal-rank order tie-break now keeps the SMALLER encoding and `AuthorizedOrder::verify` refuses any field the status does not consult, which together close a permanent third-party displacement of a paid order; a reversal now requires evidence the order was once covered; and confirmation depth is capped at what the bridge attested. The parameter structs also became `pub(crate)` with constructors so a second derivation no longer compiles -- a visibility change ONLY, not a field change: `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band is unaffected. `freenet-bitcoin-common` moved bbeed1e -> 0e5b9d9 for the attested-depth cap, and it links into all four artifacts as well. `scripts/build-contract-wasm.sh` is NOT among the causes: its reproducible-build fix landed in 47b67aa and was already in effect for the generation this supersedes"
date = "2026-09-05"
code_hash = "2eb1403aa35b94b8c6a0cbf252c7858e07b704740b0b76d4412871a643a78afa"

[[entry]]
version = "V8"
description = "Superseded by the buyer-to-seller messaging work, and for this contract the substantive change is its own and it is a change of IDENTITY. What the contract treats as one message moved from the writer-chosen `nonce` to `entry_digest`, a domain-separated BLAKE3 over every field of the entry, length-prefixed for the variable ones. The nonce is public, the mailbox is open-write and the counterparty holds the conversation key, so while the nonce was the identity anyone could submit a different message under someone else's nonce and the contract itself deleted theirs -- a deletion primitive, and in Phase 2 the deletable thing is the pre-signed confession a buyer's bond claim rests on. Four consequences move the bytes: `verify` now rejects a repeated ENTRY rather than a repeated nonce, so a legal pair is no longer permanently invalid; `MailboxSummary` became `MailboxSummaryV2` and carries 32-byte digests instead of 24-byte nonces, which is a WIRE change to the summary -- old and new can never meet only because this re-key separates them, NOT because the encodings are distinguishable, and they are not in both directions; `summarize`, `delta` and the dedup all key on the digest; and the contract's own `UpdateData::State` and `UpdateData::Delta` arms stopped deciding \"already held\" for themselves and hand everything to `apply_delta`. Also this generation: a byte budget alongside the count cap, with an oversized message refused on the way in rather than stored and pruned; `enforce_message_cap`'s walk now SKIPS a message that will not fit instead of stopping at it, which changes which messages survive a mixed-size mailbox and was made to restore the migration fold's order-invariance; and zero bytes now means \"no state here\" uniformly across all four entry points, where `get_state_delta` previously answered a new subscriber's empty summary with a decode error and never let it bootstrap. `ed25519-dalek` was added to this crate as a DEV-dependency only and is not among the causes: it does not link into the release artifact. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the buyer-to-seller messaging work: a buyer's ephemeral X25519 conversation key and the one-sided exchange it rides on, the `EncryptedMessage` envelope with `message_aad` binding every field the ciphertext does not cover, bucket padding, and the `MAX_MESSAGES` / `MAX_MAILBOX_BYTES` / `MAX_MESSAGE_BYTES` bounds. `common/src/delegate.rs` also gained the whole buyer-conversation request and response family (store, recall, forget, export, import, mark-backed-up, plus `ConversationSecret` and `RecalledConversation`), which is a wire surface between the UI and the delegate. The parameter structs are UNCHANGED this generation -- field-for-field identical to V7's, verified rather than assumed -- so `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band in `store_contract.toml` is unaffected. No new derivation split is needed"
date = "2026-09-05"
code_hash = "b3bb6b0fd90c0918114e8068de1e1cc9ba6b08aa89fbbf018970ccfb1a6b0f14"

[[entry]]
version = "V9"
description = "Superseded by the buy flow. Nothing this contract itself does changed. `harvest-common` gained `mailbox::order_binding_from_secret` -- the derivation of the value a buyer's order commitment must carry, keyed on the buyer's ephemeral X25519 private key so that the seller, who holds only the Diffie-Hellman shared secret, cannot compute it -- and that file is compiled in here, so the bytes moved. Four substantive causes, and a reader deserves all of them. (1) `OrderId` and `ListingId` are now derived from the record's own TERMS -- the whole encoded struct with the id blanked -- and are 32 bytes rather than 16. The derivation change closes a swap attack: `OrderId` hashed only (seller, listing, created_at_ms, buyer), so a seller could sign two differently-termed valid orders sharing one id and, since `merge_order`'s equal-rank tie-break keeps the smaller CBOR, publish the larger, let a buyer pay it, then publish the smaller and have the network converge on a record whose destination never received anything. `ListingId` had the same shape with a different symptom: it omitted `price`, and `ListingsV1::apply_delta` is first-writer-wins, so two listings under one id diverge permanently between peers. The widening to 32 bytes takes a chosen-pair collision from ~2^64 to 2^128 and was done here because the re-key makes it free exactly once. `verify_terms` and `AuthorizedListing::verify` now ENFORCE the derivation, so the contract refuses a record filed under any other id. (2) `Order` gained `anchor: Option<BlockAnchor>` and `order_binding: Option<[u8; 32]>`, both with `#[serde(default, skip_serializing_if)]` -- both halves load-bearing, since `verify_terms` re-serializes the order and compares against the signed payload, so a field that encoded when absent would invalidate every earlier signature. The anchor is what lets a buyer judge how recently a commitment was made without trusting a seller-chosen timestamp; the binding is `H(n)` from the incentive design, which is what stops one published commitment being payable by every buyer who was shown it. (3) Payment-proof assembly: `harvest_common::payment::assemble_on_chain_proof` builds the `OnChainPaymentProof` the verifier already accepted but which nothing constructed, so an order can now actually reach `Paid`. (4) `Order::bitcoin_address_instance_id` moved the `BLAKE3(code_hash || cbor(parameters))` address derivation into `harvest-common`, and the store contract now calls it instead of holding a second hand-written copy. This generation carries the buy flow: the buyer's request, the seller's commitment, and everything the buyer checks before paying. Several of its changes are in `harvest-common`, which is compiled into every artifact here, so these bytes move whether or not this artifact's own behaviour changed. The parameter structs are UNCHANGED this generation -- `StoreParameters`, `MailboxParameters` and `ReputationParameters` were diffed field-for-field against V8 rather than assumed -- so no new derivation split is needed and the existing legacy parameter bands are unaffected."
date = "2026-09-06"
code_hash = "08d0e54aceaa2a5a40226f371d3d1fd9dfd85cbd3694a7afdddb40ad89becd8f"

