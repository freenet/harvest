[[entry]]
version = "V10"
description = "Superseded by the buyer-to-seller messaging work, and this delegate took the largest share of it. Its own changes: the seller's long-term X25519 secret lives here and never leaves, so the Diffie-Hellman happens here too, which added `x25519-dalek` as a REAL dependency of this crate -- a new dependency subtree, and by itself sufficient to move these bytes. A new secret family, `harvest:buyer_conv:{store}:{tag}`, keeps a BUYER's per-conversation ephemeral secret so a seller's reply is still readable after the tab that sent the message is gone; before it, a buyer's keys died with the tab and a late reply was unreadable by anyone, forever. It is bounded at 256 conversations with an eviction ranking that sheds what the buyer can get back before what only exists here, and it can be genuinely FORGOTTEN -- `remove_secret` rather than an emptied value, because an emptied value left a key naming the store behind. Around it: per-conversation export and import (`harvest-conv-backup-v2:`, base58check, refused above 4 KiB before decoding because base58 is quadratic), a separately-gated backed-up marker, and the seller-side reply path. Every request is caller-gated as V9 established, including the marker request, which writes no secret and answers none and whose whole effect is to silence a warning about a conversation nobody has a copy of. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the buyer-to-seller messaging work: a buyer's ephemeral X25519 conversation key and the one-sided exchange it rides on, the `EncryptedMessage` envelope with `message_aad` binding every field the ciphertext does not cover, bucket padding, and the `MAX_MESSAGES` / `MAX_MAILBOX_BYTES` / `MAX_MESSAGE_BYTES` bounds. `common/src/delegate.rs` also gained the whole buyer-conversation request and response family (store, recall, forget, export, import, mark-backed-up, plus `ConversationSecret` and `RecalledConversation`), which is a wire surface between the UI and the delegate. The parameter structs are UNCHANGED this generation -- field-for-field identical to V7's, verified rather than assumed -- so `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band in `store_contract.toml` is unaffected. No new derivation split is needed"
date = "2026-09-05"
