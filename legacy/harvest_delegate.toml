# Superseded generations of the Harvest delegate.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# A delegate's secrets live at `secrets_dir/<delegate-key>/` on the node, so a
# re-key strands EVERY secret this delegate holds: the RSA reputation keypair,
# the transaction records, the per-identity store registry, and the Bitcoin
# watch list and bridge config. None of it is on the network, so nothing else
# can recover it.
#
# `delegate_key` is `BLAKE3(code_hash || params)` and Harvest's delegate params
# are EMPTY (`register_delegate` passes `Parameters::from(Vec::new())`), so the
# key is `BLAKE3(code_hash)`. It is recorded explicitly rather than derived at
# runtime because it is the address the old delegate actually had; the build
# re-derives it and FAILS if a row disagrees, so a typo here is a build error
# rather than a probe that quietly targets nothing.
#
# WHAT THESE ROWS CAN AND CANNOT RECOVER. The export/import handshake needs the
# PREDECESSOR delegate to answer an export request, and no generation before V5
# has an export handler -- `handle_request` in V1-V4 rejects any payload that is
# neither a `HarvestDelegateRequest` nor a `BitcoinDelegateRequest`. So the
# V1-V4 rows are recorded for completeness and for the record of what was
# deployed, and the sweep will classify every one of them `Unresponsive`: it
# adopts nothing and, correctly, seals nothing, so it retries forever at no
# cost but recovers nothing. Secrets held under V1-V4 are lost.
#
# From V5 on the export handler is PRESENT, which is the half that had to land
# early: it cannot be added to a generation retroactively, so every release
# without it adds another permanently unrecoverable one. Keep it that way.
#
# Be precise about what that buys today, because it is easy to read as more.
# The handler answers an export request; NOTHING ASKS. `delegate_lineage()` in
# `ui/src/migrate.rs` has no caller outside tests, so no re-key has actually
# carried a secret forward yet -- V5 to V6 and V6 to V7 both lost everything,
# exactly as V1-V4 did. The rows say a successor COULD recover from these
# generations, not that one has.
#
# From V7 the cost of that gap includes the Bitcoin derivation counter, and
# that one is worse than the others: the RSA keypair and the watch list are
# things a seller can recreate, while a reset counter re-issues addresses that
# already have live invoices against them. From the generation after V13 the
# delegate recovers the counter from the store's published orders when the
# same key is entered again (harvest#77), so this no longer needs a fresh
# wallet account. It recovers the highest PUBLISHED index, not the highest
# handed out; see `BITCOIN_PAYMENT_XPUB_KEY` in
# `delegates/harvest-delegate/src/bitcoin.rs` for what that leaves.

