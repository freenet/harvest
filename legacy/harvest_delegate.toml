[[entry]]
version = "V23"
description = "Superseded by instant checkout, which changed `harvest-common`: `Listing` gained `checkout` (fixed sats price and delivery) and `choices`, both `#[serde(default, skip_serializing_if)]` so every earlier listing encodes, and so is identified and signed, exactly as before; `Order` gained `request_id` (skipped when absent), and an order carrying one takes its id from the request and its `created_at`, which is the buyer's `requested_at` (`OrderId::for_request`); `merge_order` breaks an equal-status tie by the larger amount before the encoding (a change only for two orders under one id, which only a shared `request_id` produces); and `delegate.rs` / `bitcoin_delegate.rs` gained the auto-invoice arm and `PeekOrderAddresses`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This delegate's did: it answers instant-checkout requests in the background (`auto_invoice.rs`: `ArmAutoInvoice`, contract notifications, the store GET and UPDATE responses) and `PeekOrderAddresses`. It writes a new secret family under `harvest:auto:`: its arms, tip cache and exported marker stay on this node (the UI re-arms on every open), and its per-store ledgers (the instant orders whose payment is still to come off stock) are exported and merged into a successor's by order id. A successful export also marks the generation so it arms nothing again. Every existing import family is unchanged. The parameters are unchanged (empty). The generation harvest#125 shipped (`f9558cd`)."
date = "2026-09-23"
code_hash = "9463b53b02e72c444935a024ad8b05268d21eb5c6a5ead049ad88ee456a24ea1"
