[[entry]]
version = "V22"
description = "Superseded by harvest#70 (listing availability): `StoreStateV1` gained `listing_statuses`, one store-key-signed `ListingStatus` per listing id (`{listing, revision, availability: Available { quantity } | SoldOut | Withdrawn}`), merged per listing by the HIGHEST revision and then the smaller encoding (`SignedRecord::rank`, which every other signed record leaves at zero, so their merge is unchanged), and `classify_store_key_message` gained `ListingStatus`. `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This delegate's did: `SignStoreUpdate` now also signs a `ListingStatus` with the store key, through `classify_store_key_message`, which the delegate consults before signing anything with a store key. No secret family, request or response shape changed, so the export/import handshake and every import family are unchanged. The generation harvest#53 Phase C shipped (`52afb47`, #143). The parameters are unchanged (empty)."
date = "2026-09-23"
