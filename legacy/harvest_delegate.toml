description = "Superseded by harvest#162: arming instant checkout now also reads the Bitcoin tip contract once (`auto_invoice::arm` sends a `GetContractRequest` for it, and `on_tip_read` keeps the answer), so a node that had never seen the tip no longer waits up to a block for its first invoice. The tip cache's `seen_at_ms` became optional, because a tip read on arming is not a background run. The cache is not exported, so no import family changed. The parameters are unchanged (empty). The generation instant checkout shipped (`4f040c6`, #159)."
