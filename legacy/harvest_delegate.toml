[[entry]]
version = "V17"
description = "Superseded by harvest#93 phase 1a. This delegate gained the store-key requests: `CreateStoreKey` mints an Ed25519 store key from the host RNG (answered with `StoreKeyCreated`, the public half only) and `SignStoreUpdate` signs one of a store's own records with it (answered with `StoreUpdateSigned`, the envelope and signature a vault `SignResult` carries), refusing anything that is not a store record. A new secret family, `harvest:store_sk:{base58 store key}`, holds each seed; it starts with `harvest:` so the export prefix covers it, pinned by `handlers::all_secret_key_shapes`, and `MAX_STORE_KEYS` (64) bounds it. `RegisterStore` gained `store_verifying_key` and `StoreRegistration` gained the same field, both `#[serde(default)]`, so a registration this generation wrote still decodes. Every request is behind `origin::authorize`. As before, nothing drives the export handshake yet, so the secrets this generation holds (including any store key, which is why phase 1b's custody exists) do not survive the re-key. `CreateStoreKey` also gained `ghostkey_fingerprint` (`#[serde(default)]`): with it, the delegate remembers the key it minted for that Ghost Key's unfinished store creation under `harvest:store_creation:{fingerprint}` (the 32-byte verifying key, not a secret) until `RegisterStore` names it, and answers the same key to every retry; the family starts with `harvest:` and is in `all_secret_key_shapes`. Phase 1b (published with 1a) added custody: `WrapStoreKeyFor` (answered with `StoreKeyWrapped`) wraps a store key to a backing Ghost Key and signs the copy, `UnwrapStoreKey` (answered with `StoreKeyRecovered`) recovers and keeps one, and `GetStoreSubkeys` (answered with `StoreSubkeys`) returns the public halves of the inbox and record keys the store key derives; `DeriveConversationKeys` gained `store_verifying_key` (`#[serde(default)]`), deriving from the store's inbox key when set. Built at `0173527` (PR #96), the committed artifact on `main` from #96's merge, and published after it (#100)."
