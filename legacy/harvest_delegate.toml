[[entry]]
version = "V21"
description = "Superseded by harvest#53 Phase C (the receipted complaint), which changed `harvest-common`: `reputation.rs` replaced `FeedbackEntry` with `Complaint` (a buyer-signed complaint about one PAID order of the store) and `ReputationParameters` lost its RSA key, `FeedbackCategory` lost `Other`, and `delegate.rs` lost the blind-signature and transaction requests (`InitReputationKeys`, `BlindSignFeedbackToken`, `BeginTransaction`, `RecordBlindSignature`, `ListTransactions`, `TransactionRecord`). `harvest-common` is compiled into every artifact, so its changes move these bytes whether or not this artifact's own behaviour changed. This delegate's did too: it no longer answers `InitReputationKeys`, `BlindSignFeedbackToken` or the transaction requests, and no longer mints or signs with an RSA key. `GetRsaPublicKey` stays, read-only, so the reputation migration can locate a record addressed by a per-device key. The import family for RSA halves stays (a predecessor may still export a pair); the transaction-index family is gone, so a predecessor's `harvest:tx_index` would import as a standalone value (none was ever written). V21 is the generation #136 shipped (`3f3ef7b`). The parameters are unchanged (empty)."
