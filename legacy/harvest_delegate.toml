[[entry]]
version = "V11"
description = "Superseded by the buy flow. The delegate's own change is one field on an answer it already sent: `RecalledConversation` gained `order_binding`, derived in `recall()` from the STORED conversation secret rather than from the Diffie-Hellman shared secret -- the distinction is the whole of it, since the seller holds the shared secret and a binding they could compute would let one commitment be published for every buyer at once. It carries `#[serde(default)]`, and the consumer treats the resulting all-zeros as ABSENT rather than as a value, because a seller is free to sign all-zeros back. Four substantive causes, and a reader deserves all of them. (1) `OrderId` and `ListingId` are now derived from the record's own TERMS -- the whole encoded struct with the id blanked -- and are 32 bytes rather than 16. The derivation change closes a swap attack: `OrderId` hashed only (seller, listing, created_at_ms, buyer), so a seller could sign two differently-termed valid orders sharing one id and, since `merge_order`'s equal-rank tie-break keeps the smaller CBOR, publish the larger, let a buyer pay it, then publish the smaller and have the network converge on a record whose destination never received anything. `ListingId` had the same shape with a different symptom: it omitted `price`, and `ListingsV1::apply_delta` is first-writer-wins, so two listings under one id diverge permanently between peers. The widening to 32 bytes takes a chosen-pair collision from ~2^64 to 2^128 and was done here because the re-key makes it free exactly once. `verify_terms` and `AuthorizedListing::verify` now ENFORCE the derivation, so the contract refuses a record filed under any other id. (2) `Order` gained `anchor: Option<BlockAnchor>` and `order_binding: Option<[u8; 32]>`, both with `#[serde(default, skip_serializing_if)]` -- both halves load-bearing, since `verify_terms` re-serializes the order and compares against the signed payload, so a field that encoded when absent would invalidate every earlier signature. The anchor is what lets a buyer judge how recently a commitment was made without trusting a seller-chosen timestamp; the binding is `H(n)` from the incentive design, which is what stops one published commitment being payable by every buyer who was shown it. (3) Payment-proof assembly: `harvest_common::payment::assemble_on_chain_proof` builds the `OnChainPaymentProof` the verifier already accepted but which nothing constructed, so an order can now actually reach `Paid`. (4) `Order::bitcoin_address_instance_id` moved the `BLAKE3(code_hash || cbor(parameters))` address derivation into `harvest-common`, and the store contract now calls it instead of holding a second hand-written copy. This generation carries the buy flow: the buyer's request, the seller's commitment, and everything the buyer checks before paying. Several of its changes are in `harvest-common`, which is compiled into every artifact here, so these bytes move whether or not this artifact's own behaviour changed. The parameter structs are UNCHANGED this generation -- `StoreParameters`, `MailboxParameters` and `ReputationParameters` were diffed field-for-field against V8 rather than assumed -- so no new derivation split is needed and the existing legacy parameter bands are unaffected."
date = "2026-09-06"
code_hash = "73f5761fc6dfa2602d3b683473209a44b1f649d507c3187a05e7dcef02e051e8"
delegate_key = "56a736db8cf836b3d12003d242ced9cc5637a41c3c1a0c51b0f2119f5f5558f2"

