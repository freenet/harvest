# Superseded generations of the Harvest store presence contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# NO ROWS, AND THERE NEVER NEED BE ANY. Nothing at an old address is worth
# carrying forward: the state is one heartbeat signed by the store key, and a
# heartbeat is worthless `PRESENCE_FRESH_MS` (ten minutes) after it is signed.
# Readers follow the current address alone. The delegate heartbeats to the
# address the seller's tab armed it with, so the previous delegate generation
# keeps heartbeating the previous address until the seller opens the new
# Harvest, which arms the new generation with the new address. When a re-key
# also moved the store and mailbox, that generation could not take an order
# placed at the current ones, so reading its heartbeat as "open" would be
# false. When it did not (the re-key after harvest#215 moved only the
# delegate and presence), it could still take orders at the unchanged store
# and mailbox, and a reader that does not follow it reads that store closed
# while it is not: the cost, accepted for one rule that is never wrong in the
# dangerous direction.
#
# The cost, stated plainly: a presence re-key shows every store as closed to
# buyers on the new UI until its seller opens the new Harvest, however long
# that takes.
#
# `ui/build.rs` lists this file in `MAY_BE_EMPTY` permanently for that reason,
# and fails if a row is ever added here without taking it out. The file
# exists so `scripts/check-code-hashes.sh` still watches the artifact: it
# refuses a missing registry, and refuses the current hash appearing in one.
#
# Instance ids are derived per store: `BLAKE3(code_hash || cbor(
# PresenceParameters))`, whose single field is the store's verifying key
# (`harvest_common::presence`).
