[package]
name = "image-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest listing image contract: an immutable baseline JPEG addressed by its BLAKE3 hash"

# No harvest-common. This WASM's code hash is part of every image's address,
# so it depends only on the image rules and the contract interface. A change
# anywhere else in Harvest must not move it.
[dependencies]
harvest-image = { workspace = true }
freenet-stdlib = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
