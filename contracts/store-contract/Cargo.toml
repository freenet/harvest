[package]
name = "store-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest store contract: per-seller product listings with ghostkey-signed entries"

[dependencies]
harvest-common = { workspace = true }
freenet-stdlib = { workspace = true }
freenet-scaffold = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
# Enables `freenet_bitcoin_common::spv::testing`, so tests build genuine SPV
# proofs and address-contract fixtures rather than stubbing verification.
freenet-bitcoin-common = { workspace = true, features = ["test-support"] }
chrono = { workspace = true }
bs58 = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
