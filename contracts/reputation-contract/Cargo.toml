[package]
name = "reputation-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest reputation contract: append-only receipted complaints about a store's paid orders"

[dependencies]
harvest-common = { workspace = true }
freenet-stdlib = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
getrandom = { workspace = true }
# The owner certificate on the record is checked here, in the contract, so a
# record cannot carry anything but a genuine Ghost Key certificate (harvest#53
# Phase C, review round 1 P1-4). The same crate and version the UI verifies
# certificates with (`ui/src/ghostkey_cert.rs`); a second version would be a
# second idea of what a certificate is.
ghostkey_lib = "0.2"
ed25519-dalek = { workspace = true }

[dev-dependencies]
# Only to build a `Complaint` fixture (its order's timestamp, network and
# block anchor) in the harvest#55 tests.
chrono = { workspace = true }
freenet-bitcoin-common = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
