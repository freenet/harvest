[package]
name = "harvest-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for the Harvest decentralized marketplace on Freenet: store/listing/reputation schemas and feedback-token protocol messages."

[dependencies]
freenet-bitcoin-common = { workspace = true }
hex = { workspace = true }
freenet-stdlib = { workspace = true }
freenet-scaffold = { workspace = true }
freenet-scaffold-macro = { workspace = true }
ghostkey-common = { workspace = true, optional = true }
serde = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
bs58 = { workspace = true }
chrono = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# Wrapped store-key copies are byte strings in store state, which the contract
# decodes, so this one is not behind `custody`.
serde_bytes = { workspace = true }
# Store-key custody's cryptography (harvest#93 phase 1b), behind `custody`:
# the Harvest delegate and the UI need it; the contracts check only shapes and
# signatures and never compile it.
hkdf = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }

[dev-dependencies]
# Enables `freenet_bitcoin_common::spv::testing`, so `store` module tests
# build genuine SPV proofs rather than stubbing out payment verification.
freenet-bitcoin-common = { workspace = true, features = ["test-support"] }
# Custody tests check the wrap message cannot be read as an inbox entry, the
# one other domain-tagged message Harvest asks the vault to sign.
freenet-bitcoin-inbox = { workspace = true }

[features]
default = ["ghostkey"]
ghostkey = ["dep:ghostkey-common"]
# Store-key custody's cryptography: wrapping the store key to a backing Ghost
# Key's vault signature, unwrapping it, and deriving the store's inbox and
# record keys. Enabled by the delegate and the UI; never by a contract.
custody = [
    "ghostkey",
    "sealed",
    "dep:hkdf",
    "dep:aes-gcm",
    "dep:x25519-dalek",
    "dep:zeroize",
    "dep:rand_chacha",
]
# Sealing and opening buyer-seller messages (`sealed.rs`): the UI and the
# delegate, never a contract, which only stores the ciphertext. Implied by
# `custody`, which both of those enable.
sealed = ["dep:aes-gcm"]
# The contract-address guard: fixed placeholder parameter values and the
# `harvest-addresses` binary that turns them into addresses. OFF by default and
# never enabled by a contract build. This crate is compiled into all three
# contracts and the delegate, and adding this code UNGATED moved all four code
# hashes -- a guard that re-keys the artifacts it watches. The gate is a
# guarantee where a measurement was needed.
address-guard = []

# `required-features` keeps the binary out of every build that does not ask for
# it, including the contract builds. CI lints and compiles it explicitly (see
# `.github/workflows/ci.yml`), so gating it does not leave it unchecked.
[[bin]]
name = "harvest-addresses"
path = "src/bin/harvest-addresses.rs"
required-features = ["address-guard"]
