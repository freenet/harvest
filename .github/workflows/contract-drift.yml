name: contract drift

# FAILS A PULL REQUEST THAT MOVES A CONTRACT OR DELEGATE ADDRESS.
#
# A contract lives at `BLAKE3(BLAKE3(wasm) || parameters)`, and a delegate
# likewise. BOTH halves are the identity, so anything that changes either one
# re-keys the artifact and strands whatever state lived at the old address. The
# dangerous property is that NONE of it looks like a re-key in the diff:
#
#   * a direct dependency bump in Cargo.toml
#   * a TRANSITIVE bump, visible only as churn in Cargo.lock
#   * a rustc change in rust-toolchain.toml
#   * a change to the build flags in scripts/build-contract-wasm.sh
#   * a field added to or removed from a PARAMETER struct in common/
#
# The last one used to pass this job unremarked, because the job compared only
# the compiled WASM. `StoreParameters` shedding `trusted_bitcoin_bridges` and
# `bitcoin_address_code_hash` took its CBOR from 109 bytes to 56 and re-keyed
# every published store, with the WASM byte-identical and both drift guards
# reporting "unchanged" -- truthfully. It was caught by someone measuring the
# encoding by hand. The runtime symptom would have been none: the migration
# probe walks addresses that never existed, takes NotFound at each, and reports
# a clean "nothing to migrate".
#
# So this job compares the ADDRESS. `common/src/bin/harvest-addresses.rs`
# encodes each artifact's live parameter structs with the same encoder the app
# publishes with and pairs them with the built code hash; the same binary backs
# `scripts/check-code-hashes.sh`, so there is one derivation rather than two
# that drift.
#
# Dependabot is enabled on this repository and delivers a steady stream of
# routine-LOOKING PRs of exactly the first two kinds. This job rebuilds the
# contracts and the delegate on both sides of the PR and compares their
# addresses, so a re-key is a red check with the old and new addresses printed,
# instead of something discovered after a publish. The code hash is reported
# alongside so a reader can tell "the code changed" from "only the parameters
# changed": the first is a plain re-key, the second additionally needs a
# parameter-generation split in `ui/src/migrate.rs` (see
# `LAST_LEGACY_STORE_PARAM_GENERATION`), because no `legacy/` entry describes it.
#
# HOW TO PASS IT WHEN THE RE-KEY IS INTENDED: label the PR
# `contract-rekey-acknowledged`. The job still runs and still prints every
# moved address; the label records that a human read them and decided. There
# is deliberately no way to pass without either leaving the addresses alone or
# saying out loud that they moved.
#
# WHAT THIS JOB DOES NOT CHECK: whether the artifacts committed under
# `ui/public/contracts/` match the current source. This job is a RELATIVE
# check -- it answers "does this PR move the address", which is the question a
# dependency bump raises -- and it never reads the committed files at all.
# That is `ci.yml`'s `wasm-staleness` job, which rebuilds and compares the
# committed bytes. The two are complementary and neither substitutes for the
# other: a PR can leave the address alone while shipping a stale artifact, and
# refreshing a stale artifact is itself a re-key this job then has to
# acknowledge.

on:
  pull_request:
    # `labeled`/`unlabeled` are here because the acknowledgement escape hatch is
    # read from the event payload, and the default trigger types would leave a
    # freshly-applied label invisible until the next push -- `gh run rerun`
    # does not help either, since a re-run replays the ORIGINAL payload. Without
    # these two types the label would be unusable in practice, and `unlabeled`
    # matters as much as `labeled`: removing the acknowledgement has to turn the
    # check red again rather than leaving a stale green.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # THERE IS DELIBERATELY NO `paths:` FILTER, and adding one back breaks every
    # unrelated pull request.
    #
    # This job's name is a REQUIRED status check in the repository ruleset
    # "Ensure CI passes before merge". A required check that never reports is
    # not treated as satisfied -- it is treated as missing, and GitHub reports
    # the pull request as BLOCKED with no failing check to point at. A `paths:`
    # filter makes the job not run at all on a pull request that touches none
    # of those paths, so such a pull request can never merge.
    #
    # That is not hypothetical: the filter and the ruleset coexisted for a day,
    # and PR #27 (a Makefile-only change) sat MERGEABLE with four green checks
    # and mergeStateStatus BLOCKED, because the fifth required check had no
    # reason to run and so never reported.
    #
    # The earlier reasoning here was sound in isolation -- a pull request that
    # touches no build input cannot have moved an address, so the work is
    # pointless -- and it is still true. It is just not a reason to SKIP the
    # job, because "pointless work" and "check that never reports" are settled
    # by different mechanisms. The job now always runs and, on such a pull
    # request, builds both sides to identical bytes and reports green, which is
    # the correct answer rather than the absent one.
    #
    # The cost is real and measured: 2:00-2:25 per run with a warm
    # `Swatinem/rust-cache`, sampled across the fifteen most recent runs.
    #
    # Note it is paid per EVENT, not per pull request. `labeled` and `unlabeled`
    # are in `types:` above, so every label added or removed on any pull request
    # now triggers a full double build -- previously the `paths:` filter gated
    # those too. Dependabot applies labels on open, so its pull requests cost
    # more than one run each. There is deliberately no `concurrency:` group: on
    # a REQUIRED check, `cancel-in-progress` leaves a cancelled, non-success
    # check behind and blocks the merge, which is a worse failure than a few
    # wasted runner-minutes.
    #
    # The cost is accepted rather than reintroduced as skip-logic: this
    # repository's characteristic defect is a guard that reports success while
    # measuring nothing, and a hand-written path comparison inside the job would
    # be exactly that shape -- one wrong pattern and a real re-key merges under
    # a green check. This repo has already been bitten by an incomplete
    # enumeration of "what can change the bytes" once: see the StoreParameters
    # note at the top of this file, where a parameter-struct edit re-keyed every
    # published store with the WASM byte-identical.
  workflow_dispatch:

# Note there is no `push: main` trigger. After a merge the comparison has
# nothing actionable left to say -- the PR is the gate.
#
# The repository ruleset "Ensure CI passes before merge" lists this job's name
# among its required status checks, targets `~DEFAULT_BRANCH`, is `active`, and
# has an empty `bypass_actors`. An earlier version of this note said a direct
# push to main "bypasses this check entirely"; that was written before the
# ruleset existed and is not asserted here, because it has not been tested
# against it and required status checks are not only a pull-request mechanism.
# What this job is designed around, and what is verified, is the pull-request
# path.
#
# The ruleset is also what makes the absence of a `paths:` filter above
# load-bearing rather than merely wasteful: required and path-filtered are a
# combination that blocks every pull request the filter excludes.

jobs:
  wasm-address-drift:
    name: no contract or delegate address moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge base is present for the second build.
          fetch-depth: 0

      - name: pin the toolchain for BOTH builds
        run: |
          set -euo pipefail
          # Both sides are built with the toolchain THIS PR pins, so the
          # comparison isolates the source/dependency change. A change to the
          # pin itself is caught by the separate step below rather than by this
          # comparison -- otherwise raising the pin would rebuild both sides
          # with the new compiler and hide the re-key it causes.
          channel="$(sed -n 's/^ *channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          case "$channel" in
            ""|*[!0-9A-Za-z.-]*)
              echo "::error::could not read a plausible channel from rust-toolchain.toml (got '$channel')"
              exit 1 ;;
          esac
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "pinned toolchain: $channel"
      # Installed by explicit name rather than by reading rust-toolchain.toml,
      # because the base worktree built below may pin something different (or
      # nothing) and both sides must use the same compiler. RUSTUP_TOOLCHAIN
      # overrides rust-toolchain.toml for every later step.
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: install b3sum
        run: command -v b3sum || cargo install b3sum --locked

      - name: build the contracts and delegate at this PR's HEAD
        run: |
          set -euo pipefail
          ./scripts/build-contract-wasm.sh | tee /tmp/head.log
          mkdir -p /tmp/head
          cp target/wasm32-unknown-unknown/release/*.wasm /tmp/head/

      # The parameter half of every address, encoded from THIS side's parameter
      # structs. Run against the copied artifacts rather than the target dir so
      # it reads exactly the bytes the comparison below reads.
      - name: derive the addresses at this PR's HEAD
        run: |
          set -euo pipefail
          cargo run --locked --quiet \
            -p harvest-common --features harvest-common/address-guard \
            --bin harvest-addresses -- /tmp/head | tee /tmp/head-addr.tsv

      - name: report the current addresses (manual runs)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          {
            echo "## Contract and delegate addresses at this commit"
            echo
            echo "| artifact | code hash | parameters | address |"
            echo "|---|---|---|---|"
            grep -v '^#' /tmp/head-addr.tsv | while IFS=$'\t' read -r a _kind code plen _phex addr; do
              echo "| \`$a\` | \`${code:0:16}…\` | ${plen} bytes | \`$addr\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build the contracts and delegate at the merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A separate worktree rather than `git checkout` in place: each side
          # gets its own target dir, so neither build can be contaminated by
          # the other's artifacts. The absolute paths differ between the two
          # trees, which is harmless ONLY because build-contract-wasm.sh
          # remaps them -- if that remapping is ever removed this comparison
          # becomes noise. A change to that script is therefore itself a build
          # input: it runs this job (which now runs on every pull request) and,
          # if the remapping change moves an address, needs the acknowledgement
          # label like any other re-key.
          base_dir="$RUNNER_TEMP/base"
          # `fetch-depth: 0` normally leaves the base commit present, but a
          # narrow fetch configuration would not. Fetch it explicitly rather
          # than letting `worktree add` fail with an opaque message.
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_dir" "$BASE_SHA"

          # Build the base tree with THIS PR's build procedure and toolchain
          # pin. Using the base's own copies would let a PR that edits the
          # script or the pin rebuild both sides under the new rules and hide
          # the re-key; those two files are guarded by the separate step below
          # instead.
          mkdir -p "$base_dir/scripts"
          cp scripts/build-contract-wasm.sh "$base_dir/scripts/"
          cp rust-toolchain.toml "$base_dir/"

          # THIS side's address tool, for the same reason: both sides must be
          # measured by the same procedure, or the comparison is between two
          # different questions. What it must NOT carry over is the parameter
          # SHAPE -- that has to come from each side's own `common/`, which is
          # why the tool names no struct fields and asks each type for its
          # placeholder instead. `common/src/address.rs` is deliberately not
          # copied for the same reason.
          #
          # A merge base old enough to lack `harvest-common`'s `address-guard`
          # feature cannot build this, which is a real state -- the PR that
          # introduces the tool is exactly it. The step below tolerates the
          # failure and the comparison turns it into a loud, acknowledgeable
          # result rather than a silent pass.
          mkdir -p "$base_dir/common/src/bin"
          cp common/src/bin/harvest-addresses.rs "$base_dir/common/src/bin/"

          # The base may predate the committed Cargo.lock (it does for the PR
          # that introduces it). An unpinned resolve is not a meaningful
          # baseline, so say so loudly rather than comparing silently.
          if [ ! -f "$base_dir/Cargo.lock" ]; then
            echo "::warning::merge base has no Cargo.lock; its baseline build resolves dependencies fresh and is only approximate"
            export HARVEST_ALLOW_UNLOCKED=1
          fi

          ( cd "$base_dir" && ./scripts/build-contract-wasm.sh | tee /tmp/base.log )
          mkdir -p /tmp/base
          cp "$base_dir/target/wasm32-unknown-unknown/release/"*.wasm /tmp/base/

      - name: derive the addresses at the merge base
        if: github.event_name == 'pull_request'
        # Failure here is tolerated ON PURPOSE and is NOT a hole: the merge base
        # may predate the address tool, and the comparison step treats a missing
        # file as "the address question could not be answered", which fails
        # closed and needs the acknowledgement label like any other red result.
        # Letting this step's own exit code decide would collapse "the base is
        # too old" into an opaque build failure.
        continue-on-error: true
        run: |
          set -uo pipefail
          base_dir="$RUNNER_TEMP/base"
          # Same reasoning as the build script's: the address depends on the
          # resolved dependency versions, so pin them where the base has a
          # lockfile and say so loudly where it does not.
          locked=(--locked)
          if [ ! -f "$base_dir/Cargo.lock" ]; then
            locked=()
            echo "::warning::merge base has no Cargo.lock; its address derivation resolves dependencies fresh"
          fi
          if ! ( cd "$base_dir" && cargo run "${locked[@]}" --quiet \
                   -p harvest-common --features harvest-common/address-guard \
                   --bin harvest-addresses -- /tmp/base ) > /tmp/base-addr.tsv
          then
            echo "::warning::could not derive addresses at the merge base; it may predate common/src/bin/harvest-addresses.rs"
            rm -f /tmp/base-addr.tsv
          fi

      - name: compare addresses
        if: github.event_name == 'pull_request'
        env:
          ACKNOWLEDGED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-rekey-acknowledged') }}
        run: |
          set -uo pipefail
          moved=0

          # Whether the base could answer the address question at all. A base
          # that predates the address tool cannot, and that is reported rather
          # than quietly downgraded to the old code-hash-only comparison.
          base_addresses=1
          [ -s /tmp/base-addr.tsv ] || base_addresses=0

          # One artifact's column out of a tool run. Column order is fixed by
          # harvest-addresses.rs: artifact, kind, code_hash, params_len,
          # params_hex, address.
          field() {
            grep -v '^#' "$1" | awk -F'\t' -v a="$2" -v f="$3" '$1 == a { print $f }'
          }

          {
            echo "## Contract and delegate addresses"
            echo
            echo "| artifact | merge base | this PR | code | parameters | |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for a in reputation_contract store_contract mailbox_contract harvest_delegate; do
            # Missing on either side is a failure, never a silent skip: a
            # renamed or dropped artifact would otherwise pass this job by
            # having nothing to compare.
            if [ ! -f "/tmp/base/$a.wasm" ] || [ ! -f "/tmp/head/$a.wasm" ]; then
              echo "::error::$a.wasm is missing from one side of the comparison"
              echo "| \`$a\` | — | — | — | — | :x: missing |" >> "$GITHUB_STEP_SUMMARY"
              moved=1
              continue
            fi
            bc="$(b3sum "/tmp/base/$a.wasm" | cut -d' ' -f1)"
            hc="$(b3sum "/tmp/head/$a.wasm" | cut -d' ' -f1)"

            head_addr="$(field /tmp/head-addr.tsv "$a" 6)"
            head_params="$(field /tmp/head-addr.tsv "$a" 5)"
            head_plen="$(field /tmp/head-addr.tsv "$a" 4)"
            # An artifact the tool did not report is an artifact this job
            # cannot check. Same rule as a missing .wasm.
            if [ -z "$head_addr" ]; then
              echo "::error::harvest-addresses reported no address for $a at HEAD; is it missing from the table in common/src/bin/harvest-addresses.rs?"
              echo "| \`$a\` | — | — | — | — | :x: not reported |" >> "$GITHUB_STEP_SUMMARY"
              moved=1
              continue
            fi

            if [ "$bc" = "$hc" ]; then code_cell="unchanged"; else code_cell="**moved**"; fi

            if [ "$base_addresses" = 0 ]; then
              # No base address to compare against, so report what IS known and
              # let the base-unavailable failure below carry the verdict.
              echo "| \`$a\` | _unavailable_ | \`${head_addr:0:16}…\` | $code_cell | ${head_plen} bytes | :question: base not derivable |" >> "$GITHUB_STEP_SUMMARY"
              [ "$bc" = "$hc" ] || moved=1
              continue
            fi

            base_addr="$(field /tmp/base-addr.tsv "$a" 6)"
            base_params="$(field /tmp/base-addr.tsv "$a" 5)"
            base_plen="$(field /tmp/base-addr.tsv "$a" 4)"
            if [ -z "$base_addr" ]; then
              echo "::error::harvest-addresses reported no address for $a at the merge base"
              echo "| \`$a\` | — | \`${head_addr:0:16}…\` | $code_cell | — | :x: not reported |" >> "$GITHUB_STEP_SUMMARY"
              moved=1
              continue
            fi

            if [ "$base_params" = "$head_params" ]; then
              params_cell="unchanged (${head_plen} bytes)"
            else
              params_cell="**${base_plen} → ${head_plen} bytes**"
            fi

            if [ "$base_addr" = "$head_addr" ]; then
              echo "unchanged: $a  $head_addr"
              echo "| \`$a\` | \`${base_addr:0:16}…\` | \`${head_addr:0:16}…\` | $code_cell | $params_cell | unchanged |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Name WHICH half moved in the log line as well as the table: the
            # remedies differ, and a code-only re-key is a different amount of
            # work from a parameter-encoding change.
            if [ "$bc" = "$hc" ]; then
              what="its PARAMETER ENCODING changed (the WASM is byte-identical)"
            elif [ "$base_params" = "$head_params" ]; then
              what="its code changed"
            else
              what="its code AND its parameter encoding changed"
            fi
            echo "::error::$a RE-KEYS: $base_addr -> $head_addr ($what) (see the job summary; label this PR contract-rekey-acknowledged if the re-key is intended)"
            echo "| \`$a\` | \`${base_addr:0:16}…\` | \`${head_addr:0:16}…\` | $code_cell | $params_cell | :warning: **MOVED** |" >> "$GITHUB_STEP_SUMMARY"
            moved=1
          done

          echo >> "$GITHUB_STEP_SUMMARY"

          if [ "$base_addresses" = 0 ]; then
            echo "::error::The merge base could not derive its addresses, so the address comparison did not run; only the code hashes above were compared, and a parameters-only re-key is invisible to that. This is expected exactly once, on the PR that introduces common/src/bin/harvest-addresses.rs. Confirm by hand that no parameter struct moved, then add the label 'contract-rekey-acknowledged'."
            {
              echo "**The merge base could not derive its addresses.** Only the code"
              echo "hashes above were compared, and a change to a parameter struct alone"
              echo "is invisible to that comparison -- which is the gap this job exists"
              echo "to close."
              echo
              echo "Expected exactly once: on the PR that introduces"
              echo "\`common/src/bin/harvest-addresses.rs\`. Every later PR has the tool"
              echo "in its merge base."
              echo
              echo "Check by hand that no parameter struct changed, then acknowledge with"
              echo "the \`contract-rekey-acknowledged\` label."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$ACKNOWLEDGED" = "true" ]; then
              echo "::warning::base addresses unavailable, but the PR carries contract-rekey-acknowledged"
              echo "_Acknowledged via the \`contract-rekey-acknowledged\` label._" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi

          if [ "$moved" = 0 ]; then
            echo "No address moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Say the remedy in the log too, not only in the job summary. Someone
          # reading a red check should not have to open the workflow file to
          # find out what to do about it.
          echo "::error::At least one contract or delegate address moved. State stored under the old address is not reachable from the new one. If the re-key is UNINTENDED, pin the dependency or restore the parameter struct so the address stays put. If it is INTENDED, plan the migration and then add the label 'contract-rekey-acknowledged' to this PR -- applying it re-runs this check, no push needed."

          {
            echo "A moved address means the contract or delegate lives somewhere new."
            echo "State stored under the old address is not reachable from the new one."
            echo
            echo "Before merging, decide which this is:"
            echo
            echo "* **Unintended** (the usual case for a dependency bump) — close the PR,"
            echo "  or pin the dependency so the bytes stay put."
            echo "* **Intended** — plan the migration, then add the"
            echo "  \`contract-rekey-acknowledged\` label to this PR to record the decision"
            echo "  and let it merge."
            echo
            echo "Read the **code** and **parameters** columns before planning it: they"
            echo "call for different work."
            echo
            echo "* **Code moved** — append the outgoing hash to the artifact's"
            echo "  \`legacy/*.toml\` **before** rebuilding, per \`legacy/README.md\`."
            echo "  \`freenet_migrate\` re-derives each recorded generation from today's"
            echo "  parameters, so that is enough on its own."
            echo "* **Parameters moved** — that is *also* needed, and it is not enough."
            echo "  Every generation recorded in \`legacy/\` was published under the OLD"
            echo "  encoding, so re-deriving them from today's produces addresses that"
            echo "  never existed. The lineage needs a generation split like the store's"
            echo "  \`LAST_LEGACY_STORE_PARAM_GENERATION\` in \`ui/src/migrate.rs\`."
            echo "  Skipping it fails **silently**: every probe returns NotFound and the"
            echo "  sweep reports a clean migration having looked at nothing."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACKNOWLEDGED" = "true" ]; then
            echo "::warning::addresses moved, but the PR carries contract-rekey-acknowledged"
            echo
            echo "_Acknowledged via the \`contract-rekey-acknowledged\` label._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1

      - name: a toolchain or build-procedure change re-keys everything
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACKNOWLEDGED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-rekey-acknowledged') }}
        run: |
          set -uo pipefail
          # The comparison above deliberately builds both sides under THIS PR's
          # toolchain and build script, so a change to either is invisible to
          # it -- and both re-key every artifact. Check them directly.
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- rust-toolchain.toml scripts/build-contract-wasm.sh)"
          if [ -z "$changed" ]; then
            echo "toolchain pin and build procedure unchanged"
            exit 0
          fi
          echo "::error::this PR changes: $changed"
          echo "::error::Both determine the compiled bytes, so every contract and delegate address moves. If that is intended, add the label 'contract-rekey-acknowledged' to this PR -- applying it re-runs this check, no push needed."
          if [ "$ACKNOWLEDGED" = "true" ]; then
            echo "::warning::acknowledged via the contract-rekey-acknowledged label"
            exit 0
          fi
          exit 1
