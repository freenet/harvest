[workspace]
members = [
    "common",
    "contracts/reputation-contract",
    "contracts/store-contract",
    "contracts/mailbox-contract",
    "delegates/harvest-delegate",
    "ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/harvest"

[workspace.dependencies]
# Internal
harvest-common = { path = "common" }

# Freenet ecosystem
freenet-stdlib = { version = "0.6", features = ["contract"] }
freenet-scaffold = "0.2.2"
freenet-scaffold-macro = "0.2.2"
ghostkey-common = "0.2.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"

# Cryptography
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "serde"] }
blake3 = "1"
bs58 = "0.5"
# RSA blind signatures for feedback tokens (RFC 9474)
rsa = "0.9"
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
aes-gcm = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.2", features = ["custom"] }

# Dioxus UI
dioxus = { version = "=0.7.3", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "HtmlElement", "Storage", "Location", "WebSocket", "BinaryType", "Blob", "FileReader", "CloseEvent", "ErrorEvent", "MessageEvent"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
