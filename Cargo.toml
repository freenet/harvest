[workspace]
members = [
    "common",
    "contracts/reputation-contract",
    "contracts/store-contract",
    "contracts/mailbox-contract",
    "contracts/index-contract",
    "delegates/harvest-delegate",
    "ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/harvest"

[workspace.dependencies]
# Internal
harvest-common = { path = "common" }
# Local path dependency for the prototype. Switch to a git or crates.io
# dependency before this leaves one machine -- a path dep does not survive a
# clone, and CI would fail on it.
freenet-bitcoin-common = { git = "https://github.com/freenet/freenet-bitcoin", branch = "main" }
# The bridge's request inbox, and the generation pointers that locate it and
# the address contract. From the same repository and branch as the crate above
# on purpose: one git source resolves to one commit, so every `BridgeId` and
# `BitcoinNetwork` these three name is the same type. Split them across revs and
# they stop being.
freenet-bitcoin-inbox = { git = "https://github.com/freenet/freenet-bitcoin", branch = "main" }
freenet-bitcoin-generation = { git = "https://github.com/freenet/freenet-bitcoin", branch = "main" }
hex = "0.4"

# Freenet ecosystem
# 0.8.5 is what freenet-core, River and freenet-bitcoin are on. The bump from
# 0.6 is not cosmetic and not optional: `freenet-migrate` links against
# stdlib 0.8, and `__frnt_set_id` is unconditionally `#[no_mangle]` in both
# 0.6 and 0.8, so the two versions cannot co-link in one wasm module. Adopting
# the migration crate at all therefore requires this bump -- and the bump
# itself re-keys all four artifacts, which is why generation 4 is recorded in
# every registry under `legacy/`.
freenet-stdlib = { version = "0.8.5", features = ["contract"] }
freenet-scaffold = "0.2.2"
freenet-scaffold-macro = "0.2.2"
# 0.3.0 is the first release built against freenet-stdlib 0.8; 0.2.x pulls 0.6
# and would reintroduce the co-link conflict above.
ghostkey-common = "0.3"

# Upgrade migration: predecessor lineages, the contract probe driver, and the
# delegate secret-export primitives. See `legacy/*.toml` and `ui/src/migrate.rs`.
freenet-migrate = { version = "0.6", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"

# Cryptography
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "serde"] }
blake3 = "1"
bs58 = "0.5"
# RSA blind signatures for feedback tokens (RFC 9474)
rsa = "0.9"
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
aes-gcm = "0.10"
# Store-key custody (harvest#93 phase 1b): HKDF over the vault's wrap
# signature, zeroing for the secrets derived from it, a seeded RNG so the
# record RSA key regenerates identically from the store key, and byte-string
# encoding for wrapped copies in store state. `hkdf` is the only crate new to
# the tree; it rides on the `hmac`/`sha2` already here. `rand_chacha` 0.3 is
# the one on `rand_core` 0.6, which is what `rsa` 0.9 takes.
hkdf = "0.12"
zeroize = "1"
rand_chacha = "0.3"
serde_bytes = "0.11"

# Utilities
# default-features = false is load-bearing, not tidiness. chrono's default
# `wasmbind` feature imports __wbindgen_placeholder__ /
# __wbindgen_externref_xform__, which the Freenet contract runtime does not
# register -- so a module built with it compiles, publishes, and then fails to
# instantiate with no useful error. See freenet/harvest#8.
#
# The UI declares its own chrono WITH defaults: it is browser wasm, not a
# contract, so wasmbind is correct there.
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
getrandom = { version = "0.2", features = ["custom"] }

# Dioxus UI
dioxus = { version = "=0.7.3", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# No "Storage" feature: the one thing that used it was the migration marker,
# which now lives in the harvest delegate. `localStorage` throws in the
# gateway's sandboxed iframe (no `allow-same-origin`), so keeping the binding
# available invites the next reader to reach for storage that cannot work
# where this app actually runs.
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "HtmlElement", "Location", "WebSocket", "BinaryType", "Blob", "FileReader", "CloseEvent", "ErrorEvent", "MessageEvent"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# `cargo test` inherits from `[profile.dev]` by default, which builds the
# RSA-2048 / Ed25519 / BLAKE3 crypto used by the seeded-random merge-law tests
# (`common/src/store.rs`, `common/src/reputation.rs`, `common/src/mailbox.rs`,
# added in #82) completely unoptimised. Measured locally, warm cache, on two
# separate runs: four of those tests run single-threaded took 181s at the
# debug default and 13s at opt-level 2; all five run in parallel took 55s and
# 6s. The crypto primitives, not the merge logic, dominate. debug-assertions and
# overflow-checks are unaffected here (they are `[profile.dev]` keys this
# profile still inherits), so no runtime checks are lost, only the codegen
# quality of the compiled test binaries.
[profile.test]
opt-level = 2
